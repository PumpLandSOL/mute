<style>body{width:1280px;height:720px}

</style><body><div class="amb"></div><div class="scan"></div>
<div id="stage"></div><div id="cap"><span id="n"></span><span id="ct"></span></div><div id="prog"></div>
<div class="full" id="intro"><div><svg viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#00c805"/><stop offset="1" stop-color="#7dff8a"/></linearGradient></defs><path d="M6 15h7l8-7v24l-8-7H6z" fill="#ecf6ee"/><path d="M27 14l8 12M35 14l-8 12" stroke="url(#lg)" stroke-width="3.6" stroke-linecap="round"/></svg><div class="mi" style="font-size:64px;letter-spacing:.3em">MUTE</div><div style="margin-top:18px;font-size:22px;letter-spacing:.2em;color:#a9bcae">PRODUCT WALKTHROUGH · ROBINHOOD CHAIN</div></div></div>

<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>{x=cl(x);return x*x*(3-2*x)};
// [start, img, caption, [zoom scale, focus x, focus y] in 0..1 of the image]
const S=[[1.6,'01-home','One screen. Your vault is always open.',[1,.5,.5]],
[3.4,'02-mint-typed','Mint mUSD against deposited USDG',[1.55,.29,.62]],[4.8,'03-minted','Minted. Most is collateral, the rest buys and erases $MUTE',[1.55,.29,.3]],
[6.2,'04-mute-typed','Mute it',[1.55,.29,.55]],[7.4,'05-muted','Your balance is now silent to everyone but you',[1.7,.29,.3]],
[9,'06-drop-typed','Send muted, or leave a Drop: a pay link with no address',[1.55,.29,.85]],
[10.8,'08-signal','What the ledger hears: a nullifier and a commitment. Nothing else.',[1.25,.72,.4]],
[12.6,'09-desk','Blind Desk: long or short stocks, fully muted',[1.1,.6,.45]],
[14.2,'11-cryo','Bonds at −20%. Cryo-lock at −30% and earn 80% APY',[1.1,.6,.45]],
[15.8,'10-erase','40% of fees pay muted holders. The rest erases $MUTE',[1.25,.72,.35]],[17.4]];
const END=17.4,DUR=19.5;
S.slice(0,-1).forEach((s,i)=>{const im=new Image();im.src='../shots/'+s[1]+'.png';im.id='i'+i;$('stage').appendChild(im);});
const tf=(z,p)=>{const s=1+(z[0]-1)*p;const fx=z[1]*1180,fy=z[2]*705;let x=590-fx*s,y=295-fy*s;x=Math.min(0,Math.max(1180-1180*s,x));y=Math.min(0,Math.max(590-705*s,y));return `translate(${x}px,${y}px) scale(${s})`;};
window.__seek=(t)=>{
  $('intro').style.opacity=1-e((t-1.2)/.4);$('outro').style.opacity=e((t-END)/.4);$('prog').style.width=(t/DUR*1280)+'px';
  let k=0;for(let i=0;i<S.length-1;i++)if(t>=S[i][0])k=i;
  S.slice(0,-1).forEach((s,i)=>{const im=$('i'+i);im.style.opacity=i<=k?e((t-s[0])/.35):0;im.style.zIndex=i;const len=S[i+1][0]-s[0];im.style.transform=tf(s[3],e((t-s[0]-.15)/(len*.55)));});
  $('n').textContent=String(k+1).padStart(2,'0')+' / 10';$('ct').textContent=S[k][2];$('cap').style.opacity=e((t-S[k][0])/.3)*(t<END?1:0);
};window.__ready=Promise.all([...document.images].map((i)=>i.decode().catch(()=>0)));window.__seek(0);
</script>
